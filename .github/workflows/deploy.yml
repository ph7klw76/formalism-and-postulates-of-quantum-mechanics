name: Build and publish verified course
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require the confirmed lecture edition
        run: python -c "import json; c=json.load(open('course/config.json')); assert c['youtube_url'] and c['status']=='video-confirmed', 'Confirm and test the actual upload before publication'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: python -m pip install -r requirements-ci.txt
      - run: pnpm --dir webtools install --frozen-lockfile
      - name: Scientific and desktop-lab checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_course.py
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the complete course at its repository prefix
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python scripts/build_pages.py --base-path "$BASE_PATH/"
          node scripts/check-site.cjs
      - run: pnpm --dir webtools exec playwright install --with-deps chromium
      - name: H5P startup, responsive controls and actual Pyodide execution
        run: node webtools/test-course.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-verification
          path: outputs/browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual public resources and active video
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python scripts/check_live.py
